[package]
name = "baton"
version = "1.0.0"
description = "Baton - Monitor and control local agent sessions from anywhere"
authors = ["xiaoweii"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

# Shrink the release binary → faster dyld load → faster iOS cold start (pre-main).
[profile.release]
opt-level = "s"    # optimize for size
lto = true         # link-time optimization, meaningfully smaller
codegen-units = 1  # better cross-unit optimization (slower build)
strip = true       # drop symbol table
panic = "abort"    # drop unwind tables

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-speech = { path = "plugins/tauri-plugin-speech" }

[target."cfg(target_os = \"ios\")".dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString"] }
